# The radios live in submodules of parsl.monitoring.radios
[parsl]

[[parsl.executors]]
class = "ThreadPoolExecutor"
label = "threads"

[parsl.executors.remote_monitoring_radio]
class = "FilesystemRadio"

[[parsl.executors]]
class = "HighThroughputExecutor"
label = "htex"

[parsl.executors.remote_monitoring_radio]
class = "HTEXRadio"

[[parsl.executors]]
class = "MPIExecutor"
label = "mpi"

[parsl.executors.remote_monitoring_radio]
class = "UDPRadio"
address = "127.0.0.1"
port = 55056

[parsl.executors.provider]
class = "LocalProvider"

[parsl.executors.provider.launcher]
class = "SimpleLauncher"
