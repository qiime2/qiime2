on:
  release:
    types: [published]

jobs:
  build:
    name: Build Package
    runs-on: ubuntu-latest
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0

      - name: Checkout release
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v.6.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build package
        run: uv build

      - name: Store dist/*
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          path: dist

  test:
    needs: [build]
    name: Test Wheels
    strategy:
      fail-fast: false
      matrix:
        os: ['macos-latest', 'ubuntu-latest']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0

      - name: Fetch dist/*
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0

      - name: Test package
        run: QIIMETEST= uv run --isolated --no-project --with dist/*.whl pytest --pyargs rachis

  pypi:
    needs: [build, test]
    name: Publish to PyPI
    runs-on: ubuntu-latest
    # Environment and permissions for trusted publishing via PyPI
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0

      - name: Fetch dist/*
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0

      - name: Publish
        run: uv publish